<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>داشبورد الزهرا</title><style>body{font-family:Tahoma,Arial;background:#f3f6fb;color:#172033;margin:0}main{max-width:1000px;margin:auto;padding:24px}.card{background:white;border:1px solid #dce4ef;border-radius:14px;padding:18px;margin:14px 0}input,button{font:inherit;padding:10px;margin:5px;border-radius:8px;border:1px solid #b9c7d8}button{background:#173d68;color:white;cursor:pointer}.muted{color:#60728a;font-size:13px;line-height:1.9}.row{padding:12px 0;border-top:1px solid #e7edf4}.file{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px;border-top:1px solid #eee}</style></head><body><main><h1>داشبورد انتقال فایل دانشگاه الزهرا</h1><section class="card" id="login"><h3>ورود مدیر</h3><input id="pw" type="password" placeholder="رمز مدیر"><button onclick="login()">ورود</button></section><section class="card" id="panel" hidden><h3>دستگاه‌ها</h3><button onclick="loadDevices()">به‌روزرسانی</button><div id="devices"></div><h3>انتقال‌ها</h3><div id="transfers"></div></section><p class="muted">دانشجو هنگام فعال‌سازی، دربارهٔ امکان مشاهده و دریافت از راه دور فایل‌های مشترک اطلاع می‌یابد. دستگاه جدید تا تأیید مدیر قابل دسترسی نیست. برنامهٔ گوشی هنگام اشتراک‌گذاری اعلان دائمی نشان می‌دهد.</p></main><script>let token='';async function api(p,o={}){let r=await fetch(p,{...o,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(o.headers||{})}});let t=await r.text(),j={};try{j=JSON.parse(t)}catch{}if(!r.ok)throw Error(j.error||t);return j}async function login(){token=document.getElementById('pw').value;try{await api('/api/admin/devices');document.getElementById('login').hidden=true;document.getElementById('panel').hidden=false;sessionStorage.setItem('adm',token);loadDevices();loadTransfers()}catch(e){alert('ورود ناموفق: '+e.message)}}async function loadDevices(){try{let ds=await api('/api/admin/devices'),box=document.getElementById('devices');box.replaceChildren();for(let d of ds){let el=document.createElement('div');el.className='row';let title=document.createElement('b');title.textContent=d.firstName+' '+d.lastName+' — '+d.major+' | '+(d.approved?'تأییدشده':'در انتظار تأیید')+(d.revoked?' | لغوشده':'');el.append(title);if(!d.approved&&!d.revoked){let b=document.createElement('button');b.textContent='تأیید دستگاه';b.onclick=async()=>{await api('/api/admin/devices/'+encodeURIComponent(d.deviceId)+'/approve',{method:'POST',body:'{}'});loadDevices()};el.append(b)}if(d.approved&&!d.revoked){let seen=document.createElement('span');seen.className='muted';seen.textContent=' | آخرین ارتباط: '+(d.lastSeen?new Date(d.lastSeen).toLocaleString('fa-IR'):'نامشخص');el.append(seen);let s=document.createElement('button');s.textContent='نمایش فایل‌ها';s.onclick=async()=>{await api('/api/admin/devices/'+encodeURIComponent(d.deviceId)+'/scan',{method:'POST',body:'{}'});setTimeout(()=>showFiles(d.deviceId,el),3500)};el.append(s);let rv=document.createElement('button');rv.textContent='لغو دستگاه';rv.onclick=async()=>{await api('/api/admin/devices/'+encodeURIComponent(d.deviceId)+'/revoke',{method:'POST',body:'{}'});loadDevices()};el.append(rv)}box.append(el)}}catch(e){alert(e.message)}}async function showFiles(id,el){try{let j=await api('/api/admin/devices/'+encodeURIComponent(id)+'/files'),w=document.createElement('div');for(let f of j.files){let row=document.createElement('div');row.className='file';let l=document.createElement('span');l.textContent=f.name+' ('+f.size+' بایت)';let b=document.createElement('button');b.textContent='دریافت فایل';b.onclick=async()=>{await api('/api/admin/devices/'+encodeURIComponent(id)+'/transfers',{method:'POST',body:JSON.stringify({path:f.path})});alert('درخواست در صف انتقال قرار گرفت؛ اعلان فعال بودن اشتراک‌گذاری روی گوشی نمایش داده می‌شود.');};row.append(l,b);w.append(row)}el.append(w)}catch(e){alert(e.message)}}async function loadTransfers(){try{let ts=await api('/api/admin/transfers'),box=document.getElementById('transfers');box.replaceChildren();for(let t of ts){let p=document.createElement('p');p.textContent=t.name+' — '+t.status+' ';if(['queued','delivered'].includes(t.status)){let c=document.createElement('button');c.textContent='لغو انتقال';c.onclick=async()=>{try{await api('/api/admin/transfers/'+encodeURIComponent(t.id)+'/cancel',{method:'POST',body:'{}'});loadTransfers()}catch(e){alert(e.message)}};p.append(c)}if(t.status==='complete'){let b=document.createElement('button');b.textContent='دانلود';b.onclick=async()=>{let r=await fetch('/api/admin/transfers/'+t.id+'/download',{headers:{Authorization:'Bearer '+token}}),blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=t.name;a.click();URL.revokeObjectURL(u)};p.append(b)}box.append(p)}}catch(e){}}window.onload=()=>{let t=sessionStorage.getItem('adm');if(t){token=t;document.getElementById('pw').value=t;login()}};setInterval(()=>{if(token)loadTransfers()},5000);</script></body></html>
